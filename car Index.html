<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
        }
        
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .game-title {
            font-size: 60px;
            font-weight: bold;
            background: linear-gradient(to right, #4ecca3, #2e8b57, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(78, 204, 163, 0.5);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .tricker {
            font-size: 36px;
            font-weight: bold;
            color: #ffd93d;
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.7);
            margin-bottom: 50px;
            animation: tricker-animation 2s infinite;
        }
        
        @keyframes tricker-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(to right, #4ecca3, #2e8b57);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        
        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to right, #5edcb3, #3e9b67);
        }
        
        .ui-container {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 0 30px;
        }
        
        .score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .score-label {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 32px;
            font-weight: bold;
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.7);
        }
        
        .controls {
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(to right, #4ecca3, #2e8b57);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-size: 16px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to right, #5edcb3, #3e9b67);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #gameCanvas {
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }
        
        .mobile-controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 50px;
        }
        
        .mobile-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            user-select: none;
        }
        
        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(78, 204, 163, 0.5);
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
        }
        
        .game-over h2 {
            font-size: 36px;
            color: #4ecca3;
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 24px;
            margin-bottom: 25px;
        }
        
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
            
            .game-title {
                font-size: 40px;
            }
            
            .tricker {
                font-size: 24px;
            }
            
            .ui-container {
                padding: 0 15px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .score-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="sound-toggle" id="soundToggle">
            <span id="soundIcon">🔊</span>
        </div>
        
        <div class="start-screen" id="startScreen">
            <h1 class="game-title">3D RACING</h1>
            <div class="tricker" id="tricker">START RACE!</div>
            <button class="start-btn" id="startBtn">START</button>
        </div>
        
        <div class="ui-container">
            <div class="controls">
                <button id="pauseBtn">PAUSE</button>
            </div>
            
            <div class="score-container">
                <div class="score-value" id="score">0</div>
            </div>
            
            <div class="controls">
                <button id="resetBtn">RESTART</button>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let isPaused = false;
        let isGameStarted = false;
        let obstacles = [];
        let powerUps = [];
        let trees = [];
        let houses = [];
        let carPosition = { x: 0, y: 0 };
        let keys = {};
        let carMoveSpeed = 0;
        let targetCarX = 0;
        let soundEnabled = true;
        
        // DOM elements
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const scoreElement = document.getElementById('score');
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const canvas = document.getElementById('gameCanvas');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        
        // Three.js setup
        let scene, camera, renderer, car, road, ground, sky;
        
        // Audio context and sounds
        let audioContext;
        let coinSound;
        let crashSound;
        let engineSound;
        let gameOverSound;
        
        function init() {
            // Initialize audio context
            initAudio();
            
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown color
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Road
            const roadGeometry = new THREE.PlaneGeometry(20, 100);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);
            
            // Road markings
            for (let z = -50; z <= 50; z += 4) {
                const lineGeometry = new THREE.PlaneGeometry(0.5, 2);
                const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, z);
                scene.add(line);
            }
            
            // Create trees
            createTrees();
            
            // Create houses
            createHouses();
            
            // Sky
            createSky();
            
            // Event listeners
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => keys[e.key] = false);
            window.addEventListener('resize', onWindowResize);
            
            // Mobile controls
            leftBtn.addEventListener('touchstart', () => keys['ArrowLeft'] = true);
            leftBtn.addEventListener('touchend', () => keys['ArrowLeft'] = false);
            rightBtn.addEventListener('touchstart', () => keys['ArrowRight'] = true);
            rightBtn.addEventListener('touchend', () => keys['ArrowRight'] = false);
            
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);
            pauseBtn.addEventListener('click', togglePause);
            restartBtn.addEventListener('click', resetGame);
            soundToggle.addEventListener('click', toggleSound);
            
            // Start game loop
            animate();
        }
        
        function initAudio() {
            try {
                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create coin collection sound
                coinSound = createCoinSound();
                
                // Create crash sound
                crashSound = createCrashSound();
                
                // Create engine sound
                engineSound = createEngineSound();
                
                // Create game over sound
                gameOverSound = createGameOverSound();
                
            } catch (e) {
                console.log("Web Audio API is not supported in this browser");
                soundEnabled = false;
                soundIcon.textContent = "🔇";
            }
        }
        
        function createCoinSound() {
            return function() {
                if (!soundEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioContext.currentTime + 0.1); // C6
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            };
        }
        
        function createCrashSound() {
            return function() {
                if (!soundEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.5);
                
                gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            };
        }
        
        function createEngineSound() {
            return function(speed) {
                if (!soundEnabled) return;
                
                // This would be a more complex sound in a real game
                // For simplicity, we'll just play a tone based on speed
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const baseFreq = 100 + (speed * 5);
                oscillator.frequency.setValueAtTime(baseFreq, audioContext.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            };
        }
        
        function createGameOverSound() {
            return function() {
                if (!soundEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(261.63, audioContext.currentTime); // C4
                oscillator.frequency.exponentialRampToValueAtTime(130.81, audioContext.currentTime + 0.5); // C3
                
                gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            };
        }
        
        function playCoinSound() {
            if (coinSound) coinSound();
        }
        
        function playCrashSound() {
            if (crashSound) crashSound();
        }
        
        function playEngineSound() {
            if (engineSound) engineSound(gameSpeed);
        }
        
        function playGameOverSound() {
            if (gameOverSound) gameOverSound();
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundIcon.textContent = soundEnabled ? "🔊" : "🔇";
        }
        
        function createSky() {
            // Create a simple sky with a gradient
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x87CEEB,
                side: THREE.BackSide
            });
            sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);
        }
        
        function createCar() {
            // Car body
            const carBody = new THREE.Group();
            
            // Main body
            const bodyGeometry = new THREE.BoxGeometry(2, 1, 4);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecca3 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            carBody.add(body);
            
            // Cabin
            const cabinGeometry = new THREE.BoxGeometry(1.5, 0.8, 2);
            const cabinMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabin.position.y = 1.4;
            cabin.position.z = -0.5;
            cabin.castShadow = true;
            carBody.add(cabin);
            
            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
            
            for (let i = 0; i < 4; i++) {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                
                if (i < 2) {
                    wheel.position.x = -1.2;
                    wheel.position.y = 0.4;
                    wheel.position.z = i * 2.4 - 1.2;
                } else {
                    wheel.position.x = 1.2;
                    wheel.position.y = 0.4;
                    wheel.position.z = (i - 2) * 2.4 - 1.2;
                }
                
                wheel.castShadow = true;
                carBody.add(wheel);
            }
            
            // Headlights
            const headlightGeometry = new THREE.SphereGeometry(0.2, 8, 8);
            const headlightMaterial = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffcc });
            
            const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            leftHeadlight.position.set(-0.8, 0.7, 1.8);
            carBody.add(leftHeadlight);
            
            const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            rightHeadlight.position.set(0.8, 0.7, 1.8);
            carBody.add(rightHeadlight);
            
            carBody.position.y = 1;
            carBody.castShadow = true;
            scene.add(carBody);
            car = carBody;
        }
        
        function createTrees() {
            const treeGeometry = new THREE.ConeGeometry(1, 3, 8);
            const treeMaterial = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.2, 2, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            
            // Create trees on both sides of the road
            for (let z = -50; z < 50; z += 5) {
                // Left side trees
                const leftTree = new THREE.Group();
                const leftTrunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                leftTrunk.position.y = 1;
                leftTree.add(leftTrunk);
                
                const leftCrown = new THREE.Mesh(treeGeometry, treeMaterial);
                leftCrown.position.y = 3.5;
                leftTree.add(leftCrown);
                
                leftTree.position.set(-12, 0, z + Math.random() * 2);
                leftTree.castShadow = true;
                scene.add(leftTree);
                trees.push(leftTree);
                
                // Right side trees
                const rightTree = new THREE.Group();
                const rightTrunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                rightTrunk.position.y = 1;
                rightTree.add(rightTrunk);
                
                const rightCrown = new THREE.Mesh(treeGeometry, treeMaterial);
                rightCrown.position.y = 3.5;
                rightTree.add(rightCrown);
                
                rightTree.position.set(12, 0, z + Math.random() * 2);
                rightTree.castShadow = true;
                scene.add(rightTree);
                trees.push(rightTree);
            }
        }
        
        function createHouses() {
            const houseGeometry = new THREE.BoxGeometry(3, 2, 3);
            const houseMaterial = new THREE.MeshStandardMaterial({ color: 0xd2691e });
            const roofGeometry = new THREE.ConeGeometry(2.5, 1.5, 4);
            const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
            
            // Create houses on both sides of the road
            for (let z = -40; z < 40; z += 10) {
                // Left side houses
                const leftHouse = new THREE.Group();
                const leftHouseBody = new THREE.Mesh(houseGeometry, houseMaterial);
                leftHouseBody.position.y = 1;
                leftHouse.add(leftHouseBody);
                
                const leftRoof = new THREE.Mesh(roofGeometry, roofMaterial);
                leftRoof.position.y = 2.5;
                leftRoof.rotation.y = Math.PI / 4;
                leftHouse.add(leftRoof);
                
                leftHouse.position.set(-15, 0, z + Math.random() * 5);
                leftHouse.castShadow = true;
                scene.add(leftHouse);
                houses.push(leftHouse);
                
                // Right side houses
                const rightHouse = new THREE.Group();
                const rightHouseBody = new THREE.Mesh(houseGeometry, houseMaterial);
                rightHouseBody.position.y = 1;
                rightHouse.add(rightHouseBody);
                
                const rightRoof = new THREE.Mesh(roofGeometry, roofMaterial);
                rightRoof.position.y = 2.5;
                rightRoof.rotation.y = Math.PI / 4;
                rightHouse.add(rightRoof);
                
                rightHouse.position.set(15, 0, z + Math.random() * 5);
                rightHouse.castShadow = true;
                scene.add(rightHouse);
                houses.push(rightHouse);
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function createObstacle() {
            if (isGameOver || isPaused || !isGameStarted) return;
            
            const obstacleGeometry = new THREE.BoxGeometry(2, 1, 2);
            const obstacleMaterial = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
            
            // Random position on the road
            obstacle.position.x = (Math.random() * 12) - 6;
            obstacle.position.y = 1;
            obstacle.position.z = -50;
            
            obstacle.castShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        
        function createPowerUp() {
            if (isGameOver || isPaused || !isGameStarted) return;
            
            const powerUpGeometry = new THREE.SphereGeometry(0.8, 16, 16);
            const powerUpMaterial = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
            const powerUp = new THREE.Mesh(powerUpGeometry, powerUpMaterial);
            
            // Random position on the road
            powerUp.position.x = (Math.random() * 12) - 6;
            powerUp.position.y = 1;
            powerUp.position.z = -50;
            
            powerUp.castShadow = true;
            scene.add(powerUp);
            powerUps.push(powerUp);
        }
        
        function updateGame() {
            if (isGameOver || isPaused || !isGameStarted) return;
            
            // Smooth car movement
            if (keys['ArrowLeft'] && targetCarX > -7) {
                targetCarX -= 0.2;
            }
            if (keys['ArrowRight'] && targetCarX < 7) {
                targetCarX += 0.2;
            }
            
            // Apply smooth movement to car
            car.position.x += (targetCarX - car.position.x) * 0.1;
            
            // Move obstacles and power-ups
            obstacles.forEach((obstacle, index) => {
                obstacle.position.z += gameSpeed * 0.1;
                
                // Remove if behind the camera
                if (obstacle.position.z > 10) {
                    scene.remove(obstacle);
                    obstacles.splice(index, 1);
                }
                
                // Check collision with car
                if (Math.abs(obstacle.position.x - car.position.x) < 1.5 && 
                    Math.abs(obstacle.position.z - car.position.z) < 2) {
                    playCrashSound();
                    gameOver();
                }
            });
            
            powerUps.forEach((powerUp, index) => {
                powerUp.position.z += gameSpeed * 0.1;
                powerUp.rotation.y += 0.05;
                
                // Remove if behind the camera
                if (powerUp.position.z > 10) {
                    scene.remove(powerUp);
                    powerUps.splice(index, 1);
                }
                
                // Check collision with car
                if (Math.abs(powerUp.position.x - car.position.x) < 1.5 && 
                    Math.abs(powerUp.position.z - car.position.z) < 2) {
                    scene.remove(powerUp);
                    powerUps.splice(index, 1);
                    score += 50;
                    updateScore();
                    playCoinSound();
                }
            });
            
            // Handle car speed
            if (keys['ArrowUp'] && gameSpeed < 15) {
                gameSpeed += 0.05;
                // Play engine sound when accelerating
                if (Math.random() < 0.1) playEngineSound();
            }
            if (keys['ArrowDown'] && gameSpeed > 3) {
                gameSpeed -= 0.05;
            }
            
            // Nitro boost with spacebar
            if (keys[' ']) {
                gameSpeed = Math.min(gameSpeed + 0.1, 20);
                // Play engine sound when using nitro
                if (Math.random() < 0.2) playEngineSound();
            }
            
            // Increase score over time
            score += Math.floor(gameSpeed / 2);
            updateScore();
            
            // Gradually increase difficulty
            if (score % 1000 === 0) {
                gameSpeed += 0.5;
            }
            
            // Move trees and houses to create illusion of movement
            trees.forEach(tree => {
                tree.position.z += gameSpeed * 0.1;
                if (tree.position.z > 10) {
                    tree.position.z = -50;
                }
            });
            
            houses.forEach(house => {
                house.position.z += gameSpeed * 0.1;
                if (house.position.z > 10) {
                    house.position.z = -50;
                }
            });
        }
        
        function updateScore() {
            scoreElement.textContent = score;
        }
        
        function gameOver() {
            isGameOver = true;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            playGameOverSound();
        }
        
        function startGame() {
            isGameStarted = true;
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);
            
            // Create car after game starts
            createCar();
            
            // Start generating obstacles and power-ups
            setInterval(createObstacle, 1500);
            setInterval(createPowerUp, 2000);
        }
        
        function resetGame() {
            // Reset game state
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isPaused = false;
            targetCarX = 0;
            
            // Update UI
            updateScore();
            gameOverElement.style.display = 'none';
            pauseBtn.textContent = 'PAUSE';
            
            // Remove all obstacles and power-ups
            obstacles.forEach(obstacle => scene.remove(obstacle));
            powerUps.forEach(powerUp => scene.remove(powerUp));
            obstacles = [];
            powerUps = [];
            
            // Reset car position
            if (car) {
                car.position.x = 0;
            }
        }
        
        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'RESUME' : 'PAUSE';
        }
        
        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }
        
        // Start the game
        init();
    </script>
</body>
</html>
